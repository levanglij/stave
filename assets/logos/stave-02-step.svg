<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img" aria-label="Stave">
  <title>Stave — Step Signal</title>
  <!-- Mark: a step function climbing the rating ladder, ending in green -->
  <g transform="translate(12, 16)" fill="none" stroke-width="3" stroke-linejoin="miter" stroke-linecap="butt">
    <polyline points="0,48 12,48 12,36 24,36 24,24 36,24 36,12" stroke="currentColor"/>
    <line x1="36" y1="12" x2="50" y2="12" stroke="#10B981"/>
  </g>
  <circle cx="62" cy="28" r="4" fill="#10B981"/>
  <!-- Wordmark -->
  <text x="80" y="52" font-family="Inter, -apple-system, system-ui, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="currentColor" letter-spacing="-1.2">Stave</text>
</svg>
